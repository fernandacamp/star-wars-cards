<section class="sw-deck-list-page">
  <header class="sw-deck-list-header">
    <div class="sw-deck-list-title-group">
      <h1 class="sw-deck-list-title">
        Decks
      </h1>

      <p class="sw-deck-list-subtitle">
        Monte coleções poderosas de cartas e organize seus personagens favoritos.
      </p>
    </div>

    <div class="sw-deck-list-header-actions">
      <app-button
        type="primary"
        [label]="'Novo deck'"
        (click)="createDeck()"
      ></app-button>
    </div>
  </header>

  <section class="sw-deck-list-content">
    <div class="sw-deck-list-info-row">
      <span class="sw-deck-list-count">
        Total de decks: {{ totalItems }}
      </span>
    </div>

    <div class="sw-deck-list-grid">
      @for (deck of pagedDecks; track deck.id) {
        <app-deck-card
          [deck]="deck"
          (view)="viewDeck()"
          (edit)="editDeck()"
          (delete)="deleteDeck()"
          (toggleFavorite)="favoriteDeck()"
        ></app-deck-card>
      }
    </div>

    <div class="sw-deck-list-pagination">
      <app-pagination
        [totalItems]="totalItems"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [showFirstLast]="true"
        [maxVisiblePages]="5"
        (pageChange)="pageChange($event)"
      ></app-pagination>
    </div>
  </section>
</section>
